<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoLab</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F7FF; color: #1F2937;
         font: 17px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  .the { max-width: 440px; margin: 24px; padding: 32px 28px; background: #fff; border: 1px solid #DCE5F5; border-radius: 20px;
         box-shadow: 0 10px 30px rgba(36, 81, 199, .1); text-align: center; }
  .logo { width: 72px; height: 72px; margin: 0 auto 14px; }
  h1 { margin: 0 0 6px; font-size: 22px; color: #1A3A9C; }
  p { margin: 0 0 20px; color: #4B5563; }
  button { font: inherit; font-weight: 700; color: #fff; background: #2451C7; border: 0; border-radius: 12px; padding: 12px 28px; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="the">
  <svg class="logo" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="10" fill="#2451C7"/>
    <path d="M11 15 L22 10 L30 15 L30 27 L19 31 L11 27 Z" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M11 15 L19 19 L30 15 M19 19 L19 31" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M22 10 L22 22 L11 27 M22 22 L30 27" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="2 2" opacity=".75"/></svg>
  <h1>Chưa kết nối mạng</h1>
  <p>GeoLab cần Internet để đăng nhập và mở mô hình. Hãy bật Wi-Fi hoặc dữ liệu di động rồi bấm Thử lại.</p>
  <button onclick="window.GeoLabApp && GeoLabApp.thuLai()">Thử lại</button>
</div>
</body>
</html>
