# Đóng gói GeoInk cho Windows (file cài đặt trực tuyến) và phát hành lên GitHub Releases.
#  - Đẩy tag dạng v0.1.0 (trùng "version" trong package.json) → đóng gói và phát hành.
#  - Chạy tay (Actions → Đóng gói GeoInk → Run workflow) → chỉ đóng gói thử, tải ở mục Artifacts.
name: Đóng gói GeoInk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Đóng gói và phát hành
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Đóng gói thử
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: GeoInk-windows
          path: dist/nsis-web/*
          if-no-files-found: error
