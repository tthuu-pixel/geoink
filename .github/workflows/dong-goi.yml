# Đóng gói GeoInk cho Windows (file cài đặt trực tuyến) và phát hành lên GitHub Releases.
# Mỗi lần đẩy lên nhánh main (hoặc chạy tay ở tab Actions): đóng gói trên máy Windows.
# Nếu phiên bản trong package.json chưa có bản phát hành, electron-builder tạo bản phát hành
# mới (tag v<phiên bản>) và đăng file cài đặt. Phiên bản đã phát hành thì chỉ đóng gói thử.
name: Đóng gói GeoInk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dong-goi
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Đóng gói và phát hành
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: GeoInk-windows
          path: dist/nsis-web/*
          if-no-files-found: error
