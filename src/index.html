<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoInk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Hàng 1: viết tay (kiểu Scrble Ink) -->
<header id="hang-viet" class="hang">
  <button class="nut" id="nut-menu" title="Menu"><i data-bt="menu"></i></button>
  <span class="ke"></span>
  <button class="nut" data-lenh="mo" title="Mở bảng (Ctrl+O)"><i data-bt="mo"></i></button>
  <button class="nut" data-lenh="luu" title="Lưu (Ctrl+S)"><i data-bt="luu"></i></button>
  <button class="nut" data-lenh="hoanTac" title="Hoàn tác (Ctrl+Z)"><i data-bt="hoanTac"></i></button>
  <button class="nut" data-lenh="lamLai" title="Làm lại (Ctrl+Y)"><i data-bt="lamLai"></i></button>
  <span class="ke"></span>
  <button class="nut" data-lenh="nhapPdf" title="Nhập tệp PDF"><i data-bt="pdf"></i></button>
  <span class="ke"></span>
  <div class="cap"><button class="nut" data-cc="but" title="Bút (P)"><i data-bt="but"></i></button><button class="mui-xo" data-xo="but" title="Độ dày, màu bút"><i data-bt="xuong"></i></button></div>
  <div class="cap"><button class="nut" data-cc="tay" title="Tẩy (E)"><i data-bt="tay"></i></button><button class="mui-xo" data-xo="tay" title="Cỡ tẩy"><i data-bt="xuong"></i></button></div>
  <div class="cap"><button class="nut" data-cc="dq" title="Bút dạ quang (H)"><i data-bt="dq"></i></button><button class="mui-xo" data-xo="dq" title="Độ dày, màu dạ quang"><i data-bt="xuong"></i></button></div>
  <div class="khay" id="khay-mau" title="Màu bút"></div>
  <div class="khay" id="khay-co" title="Độ dày nét"></div>
  <div class="khay" id="khay-dq" title="Màu dạ quang"></div>
  <span class="ke"></span>
  <button class="nut" data-cc="chon" title="Chọn và kéo (V)"><i data-bt="chon"></i></button>
  <button class="nut" data-cc="keo" title="Kéo trang"><i data-bt="keo"></i></button>
  <div class="gian"></div>
  <span id="thong-tin" title="Bấm để về 100%">1 / 1 · 100%</span>
  <button class="nut" data-lenh="toanManHinh" title="Toàn màn hình (F11)"><i data-bt="toanManHinh"></i></button>
</header>

<!-- Hàng 2: dựng hình, đo, đồ thị (kiểu GeoGebra) -->
<nav id="hang-hinh" class="hang"></nav>

<aside id="thanh-trai">
  <div id="ds-trang-pdf"></div>
  <div id="tay-keo-trai" title="Kéo để mở rộng / thu hẹp"><span></span></div>
</aside>

<main id="bang">
  <canvas id="ve"></canvas>
  <canvas id="nhap"></canvas>
  <div id="goi-y" class="an"></div>
  <div id="thu-phong">
    <button class="nut nho" data-lenh="thuNho" title="Thu nhỏ"><i data-bt="thuNho"></i></button>
    <button class="nut nho" data-lenh="phongTo" title="Phóng to"><i data-bt="phongTo"></i></button>
  </div>
</main>

<footer id="tab-trang"></footer>

<!-- Menu ☰ -->
<div id="menu" class="an" role="menu">
  <button data-lenh="moi"><i data-bt="moi"></i>Bảng mới<kbd>Ctrl+N</kbd></button>
  <button data-lenh="mo"><i data-bt="mo"></i>Mở…<kbd>Ctrl+O</kbd></button>
  <button data-lenh="luu"><i data-bt="luu"></i>Lưu<kbd>Ctrl+S</kbd></button>
  <button data-lenh="luuThanh"><i data-bt="luu"></i>Lưu thành tệp khác…<kbd>Ctrl+⇧+S</kbd></button>
  <button data-lenh="nhapPdf"><i data-bt="pdf"></i>Nhập tệp PDF…</button>
  <button data-lenh="xuatAnh"><i data-bt="anh"></i>Xuất trang ra ảnh PNG</button>
  <hr>
  <div class="tieu-de-menu">Nền trang</div>
  <div class="nen-menu" id="nen-menu"></div>
  <hr>
  <button data-lenh="themTrang"><i data-bt="themTrang"></i>Thêm trang</button>
  <button data-lenh="xoaTrang"><i data-bt="xoaTrang"></i>Xoá hết nội dung trang này</button>
  <button data-lenh="xoaTrangNay"><i data-bt="xoa"></i>Xoá trang này</button>
  <hr>
  <button data-lenh="toanManHinh"><i data-bt="toanManHinh"></i>Toàn màn hình<kbd>F11</kbd></button>
  <div class="phien-ban" id="phien-ban">GeoInk</div>
</div>

<div id="hop-ham-so" class="hop an" role="dialog" aria-label="Vẽ đồ thị hàm số">
  <div class="hop-noi-dung">
    <h2>Vẽ đồ thị hàm số</h2>
    <label class="o-ham">y = <input id="o-ham" autocomplete="off" spellcheck="false" placeholder="2x + 1"></label>
    <div id="loi-ham" class="loi"></div>
    <div class="vi-du">Ví dụ:
      <button data-vd="2x + 1">2x + 1</button><button data-vd="-x + 3">−x + 3</button><button data-vd="x^2">x²</button>
      <button data-vd="-1/2x^2 + 2">−½x² + 2</button><button data-vd="1/x">1/x</button><button data-vd="sqrt(x)">√x</button><button data-vd="|x|">|x|</button>
    </div>
    <p class="ghi-chu">Viết <b>x^2</b> cho x², <b>1/2x</b> cho ½x, <b>sqrt(x)</b> cho √x. Có thể dùng sin, cos, tan, |x|.</p>
    <div class="hanh-dong"><button class="nut chu" data-dong>Huỷ</button><button class="nut chu chinh" id="nut-ve-ham">Vẽ đồ thị</button></div>
  </div>
</div>

<div id="hop-mo-hinh" class="hop an" role="dialog" aria-label="Chèn mô hình GeoLab">
  <div class="hop-noi-dung rong">
    <h2>Chèn mô hình GeoLab</h2>
    <p class="ghi-chu">Bấm một mô hình để đặt lên bảng. Trên bảng, bấm <b>“Mở mô hình GeoLab”</b> để mở mô hình tương tác (cần có mạng).</p>
    <div class="loc" id="loc-mo-hinh"></div>
    <div class="luoi-mo-hinh" id="luoi-mo-hinh"></div>
    <div class="hanh-dong"><button class="nut chu" data-dong>Đóng</button></div>
  </div>
</div>

<div id="hop-nhap" class="hop an" role="dialog">
  <div class="hop-noi-dung">
    <h2>Nhập</h2>
    <label class="nhap-dong"><span>Giá trị</span><input autocomplete="off" spellcheck="false"><textarea rows="3" class="an"></textarea></label>
    <div class="loi"></div>
    <div class="hanh-dong"><button class="nut chu" data-huy>Huỷ</button><button class="nut chu chinh">Đồng ý</button></div>
  </div>
</div>

<div id="tuy-chon-but" class="an"></div>
<div id="thong-bao" class="an"></div>

<script src="thu-vien/pdf.min.js"></script>
<script src="bieutuong.js"></script>
<script src="mohinh.js"></script>
<script src="bieuthuc.js"></script>
<script src="hinh.js"></script>
<script src="app.js"></script>
</body>
</html>
